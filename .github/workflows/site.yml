# Publica site/ (landing + app) no GitHub Pages a cada push na main que mexa no site ou no núcleo.
# Ativar uma vez: Settings → Pages → Source: GitHub Actions.
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '*.py', 'web/**', 'tools/**', 'fontes/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Empacotar o núcleo para o app no navegador
        run: python tools/empacotar_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
