# Testes a cada push e PR: a main só recebe o que passou aqui (badge "Testes" no README).
name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest -q

  js:
    name: JavaScript (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxe do app
        run: for f in site/app/*.js site/app/js/*.js site/app/js/stories/*.js; do node --check "$f"; done
      - name: Testes da lógica dos stories
        run: node --test tests/js/*.test.mjs
