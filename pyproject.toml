[project]
name = "syncup"
version = "1.10.0"
description = "Comparador local de históricos do Spotify: Dupla, Match, Wrapped e Grupo."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Carlos (Hazykiuu)" }]

[project.urls]
Repository = "https://github.com/Hazykiuu/SyncUp"

[tool.pytest.ini_options]
minversion = "8.3"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-config --strict-markers"
norecursedirs = ["tests/fixtures", "exemplos_ficticios"]
markers = [
    "golden: regressão contra referências numéricas previamente salvas",
    "ui: criação de componentes ou fluxo HTTP local do Gradio",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "tests/fixtures", # Fontes congeladas: hashes do golden master não podem mudar.
    "exemplos_ficticios",
    ".syncup_cache",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
# Tuplas em isinstance são mantidas por legibilidade e compatibilidade acadêmica.
ignore = ["UP038"]

[tool.ruff.lint.per-file-ignores]
# Scripts históricos permitem execução direta e ajustam sys.path antes dos imports.
"tests/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
line-ending = "lf"
