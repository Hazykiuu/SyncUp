<!-- Ordem: núcleo (listas, corrida, stories) → estilo do site → ajustes do app. -->
<link rel="stylesheet" href="nucleo.css">
<link rel="stylesheet" href="../estilo.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="stories.css">
<!-- integrity: se o CDN trocar o arquivo, o navegador recusa (o código roda com acesso ao histórico). -->
<script type="importmap">{ "imports": { "preact-htm": "https://unpkg.com/htm@3.1.1/preact/standalone.module.js" }, "integrity": { "https://unpkg.com/htm@3.1.1/preact/standalone.module.js": "sha384-StNNHifqKmppGEDNqrv+YtX8PD3mhAhLtNbioQ4QxbPNqaTnktcDjsIPGjcDoiKa" } }</script>
</head>
<body class="js">
<!-- Vindo de "Abrir o app": o conteúdo entra subindo (estilo.css, .entrando). -->
<script>try { if (sessionStorage.getItem('syncup-entrada')) { sessionStorage.removeItem('syncup-entrada'); document.body.classList.add('entrando'); } } catch { /* abre direto */ }</script>
<!-- Entrada vindo de "Abrir o app" (entrada.js): a logo grande entra em sintonia e pousa no lugar dela. -->
<div class="pouso" aria-hidden="true"><span class="marca pouso-marca"><span class="logo"><i></i><i></i><i></i><i></i></span></span></div>
<a class="pular" href="#principal">Pular para o conteúdo</a>
<!-- Esqueleto da primeira tela (some quando o app desenha, main.js): o logo pulsa como equalizador. -->
<div id="app"><div class="esqueleto shell" role="status" aria-label="Carregando o SyncUp…">
  <span class="marca vivo" aria-hidden="true"><span class="logo"><i></i><i></i><i></i><i></i></span>SyncUp</span>
  <div class="esq-linha esq-titulo"></div><div class="esq-linha"></div>
  <div class="esq-cartao superficie"></div><div class="esq-cartao superficie"></div>
</div></div>
<noscript><p class="shell">O SyncUp precisa de JavaScript para rodar no navegador.</p></noscript>
<script type="module" src="js/entrada.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
